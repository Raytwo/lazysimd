[package]
name = "lazysimd"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MPL-2.0"
description = "Fast portable SIMD byte-pattern (signature) scanner with AVX2/SSE2/NEON/scalar paths."
authors = ["Raytwo <raytwo@arcropolis.com>"]
repository = "https://github.com/Raytwo/lazysimd"
readme = "README.md"
keywords = ["simd", "pattern", "signature", "scan"]
categories = ["algorithms"]
exclude = [".github/"]

[dependencies]

[dev-dependencies]
criterion = "0.5"
rand = "0.8"

[[bench]]
name = "find_pattern"
harness = false
